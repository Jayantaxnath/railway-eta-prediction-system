# Spring Application Name
spring.application.name=train-eta

# PostgreSQL Configuration
# Defaults are inlined here — env vars override at runtime (no intermediate properties to avoid circular references)
spring.datasource.url=jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:sih}
spring.datasource.username=${POSTGRES_USER:umarfiroz}
spring.datasource.password=${POSTGRES_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# RailRadar API Configuration
railway.api.url=${RAILWAY_API_URL:https://api.railradar.in/v1}
railway.api.key=${RAILWAY_API_KEY}

# ML API Configuration (FastAPI / XGBoost microservice)
ml.api.url=${ML_API_URL:http://localhost:8000}
ml.api.timeout=${ML_API_TIMEOUT:10000}

# Train Data Ingestion Scheduler (milliseconds — default 300000 = 5 mins)
train.ingestion.interval=${TRAIN_DATA_FETCH_INTERVAL:300000}
train.ingestion.active-trains=${ACTIVE_TRAIN_NUMBERS:12919,12920}

# OpenWeatherMap API Configuration
openweather.api.url=${OPENWEATHER_API_URL:https://api.openweathermap.org/data/2.5}
openweather.api.key=${OPENWEATHER_API_KEY}


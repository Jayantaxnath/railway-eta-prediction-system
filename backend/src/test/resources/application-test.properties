# ── In-memory H2 for integration tests (no Postgres required) ──
spring.datasource.url=jdbc:h2:mem:sih_test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

# Disable the 5-minute scheduler during tests
train.ingestion.interval=999999999
train.ingestion.active-trains=

# ML API mocked in test - point to non-existent port
ml.api.url=http://localhost:9999
ml.api.timeout=1000

# Dummy external API keys
railway.api.url=http://localhost:9999
railway.api.key=test-key
openweather.api.url=http://localhost:9999
openweather.api.key=test-key
